<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindBridge — Clientes</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0D1B2A;
    font-family: 'Barlow', sans-serif;
    height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow: hidden;
  }
  .slide {
    width: 1280px;
    height: 720px;
    background: #0D1B2A;
    position: relative;
    overflow: hidden;
  }
  .accent-line {
    position: absolute;
    left: 0; top: 0;
    width: 7px; height: 100%;
    background: #05C8E0;
  }
  .title {
    position: absolute;
    top: 24px; left: 44px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: 42px;
    color: #FFF;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards 0.1s;
  }
  .subtitle {
    position: absolute;
    top: 76px; left: 44px;
    font-size: 12px; color: #05C8E0;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards 0.3s;
  }

  /* Zona central entre título y leyenda — carruseles centrados aquí */
  .carousel-zone {
    position: absolute;
    top: 62px;
    bottom: 130px;
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
    transform: translateY(-132px);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, black 7%, black 93%, transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0%, black 7%, black 93%, transparent 100%);
  }

  .carousel-track {
    display: flex;
    gap: 16px;
    width: max-content;
  }
  .track-left  { animation: scrollLeft  28s linear infinite; }
  .track-right { animation: scrollRight 32s linear infinite; }

  .client-card {
    width: 175px;
    height: 96px;
    background: #131f2d;
    border: 1px solid rgba(5,200,224,0.12);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    flex-shrink: 0;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .client-card:hover {
    border-color: rgba(5,200,224,0.45);
    box-shadow: 0 0 18px rgba(5,200,224,0.2);
  }
  .client-card img {
    max-width: 100%;
    max-height: 60px;
    object-fit: contain;
  }

  /* Leyenda */
  .leyenda {
    position: absolute;
    bottom: 178px;
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0;
    animation: fadeIn 0.5s ease forwards 0.8s;
  }
  .leyenda-line {
    width: 500px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(5,200,224,0.4), transparent);
  }
  .leyenda-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 30px;
    color: rgba(255,255,255,0.85);
    letter-spacing: 1.5px;
    text-align: center;
    min-height: 38px;
  }
  .tw-cyan { color: #05C8E0; }
  .cur {
    display: inline-block;
    width: 3px; height: 28px;
    background: #05C8E0;
    margin-left: 3px;
    vertical-align: middle;
    animation: blink 0.7s step-end infinite;
  }
  .cur.done { animation: none; opacity: 0; }

  /* Logo footer */

  @keyframes fadeUp    { to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn    { to { opacity: 1; } }
  @keyframes scrollLeft  { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes scrollRight { from { transform: translateX(-50%); } to { transform: translateX(0); } }
  @keyframes blink     { 0%,100%{opacity:1;} 50%{opacity:0;} }
</style>
</head>
<body>
<div class="slide">
  <div class="accent-line"></div>

  <div class="carousel-zone">
    <div class="carousel-track track-left"  id="row1"></div>
    <div class="carousel-track track-right" id="row2"></div>
  </div>

  <p style="position:absolute;bottom:270px;left:0;right:0;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.25rem;letter-spacing:.06em;color:rgba(255,255,255,.75);padding:0 5%;">
    "El éxito de una solución depende mayormente de la capacidad de adopción de los usuarios"

</div>

function buildRow(trackEl, items) {
  const doubled = [...items, ...items, ...items];
  doubled.forEach(c => {
    const card = document.createElement('div');
    card.className = 'client-card';
    card.innerHTML = `<img src="${c.img}" alt="${c.name}">`;
    trackEl.appendChild(card);
  });
}

buildRow(document.getElementById('row1'), all.slice(0, 9));
buildRow(document.getElementById('row2'), all.slice(11));

// Typewriter
const part1 = "Casos de éxito que comprueban ";
const part2 = "nuestra trayectoria";
const elBefore = document.getElementById('tw-before');
const elCyan   = document.getElementById('tw-cyan');
const cur      = document.getElementById('cur');
let i = 0;
const fullText = part1 + part2;

function startTypewriter() {
  elBefore.textContent = '';
  elCyan.textContent = '';
  cur.classList.remove('done');
  i = 0;
  function type() {
    if (i < fullText.length) {
      if (i < part1.length) elBefore.textContent += fullText[i];
      else elCyan.textContent += fullText[i];
      i++;
      setTimeout(type, 55 + Math.random() * 30);
    } else {
      cur.classList.add('done');
      setTimeout(startTypewriter, 3500);
    }
  }
  setTimeout(type, 600);
}
startTypewriter();
</script>
