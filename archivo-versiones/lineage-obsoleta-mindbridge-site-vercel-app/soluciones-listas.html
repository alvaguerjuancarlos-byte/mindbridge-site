<head>

<title>MindBridge â€” Soluciones listas para usarse</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0D1B2A;
    font-family: 'Barlow', sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .slide {
    width: 1280px;
    height: 850px;
    background: #0D1B2A;
    position: relative;
    overflow: hidden;
  }
  .accent-line {
    position: absolute;
    left: 0; top: 0;
    width: 7px; height: 100%;
    background: #05C8E0;
  }
  .title {
    position: absolute;
    top: 85px; left: 44px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: 42px;
    color: #FFF;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards 0.1s;
  }
  .subtitle {
    position: absolute;
    top: 205px; left: 44px;
    font-size: 12px; color: #05C8E0;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards 0.3s;
  }

  /* Carruseles centrados */
  .carousel-zone {
    position: absolute;
    top: 0px;
    bottom: 66px;
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, black 7%, black 93%, transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0%, black 7%, black 93%, transparent 100%);
  }

  .carousel-track {
    display: flex;
    gap: 16px;
    width: max-content;
  }
  .track-left  { animation: scrollLeft  26s linear infinite; }
  .track-right { animation: scrollRight 30s linear infinite; }

  .sol-card {
    width: 180px;
    height: 96px;
    background: #131f2d;
    border: 1px solid rgba(5,200,224,0.12);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    flex-shrink: 0;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .sol-card:hover {
    border-color: rgba(5,200,224,0.45);
    box-shadow: 0 0 18px rgba(5,200,224,0.2);
  }
  .sol-card img {
    max-width: 100%;
    max-height: 60px;
    object-fit: contain;
  }

  /* Leyenda typewriter */
  .leyenda {
    position: absolute;
    bottom: 184px;
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0;
    animation: fadeIn 0.5s ease forwards 0.8s;
  }
  .leyenda-line {
    width: 500px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(5,200,224,0.4), transparent);
  }
  .leyenda-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 30px;
    color: rgba(255,255,255,0.85);
    letter-spacing: 1.5px;
    text-align: center;
    min-height: 38px;
  }
  .tw-cyan { color: #05C8E0; }
  .cur {
    display: inline-block;
    width: 3px; height: 28px;
    background: #05C8E0;
    margin-left: 3px;
    vertical-align: middle;
    animation: blink 0.7s step-end infinite;
  }
  .cur.done { animation: none; opacity: 0; }

  

  @keyframes fadeUp    { to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn    { to { opacity: 1; } }
  @keyframes scrollLeft  { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes scrollRight { from { transform: translateX(-50%); } to { transform: translateX(0); } }
  @keyframes blink     { 0%,100%{opacity:1;} 50%{opacity:0;} }

  @media (max-width: 768px) {
    body {
      display: block !important;
      overflow: visible !important;
      height: auto !important;
      align-items: flex-start !important;
      justify-content: flex-start !important;
      padding: 0 !important;
    }
    .slide {
      width: 100% !important;
      height: auto !important;
      min-height: 0 !important;
      position: relative !important;
      overflow: visible !important;
      padding: 6rem 0 2rem !important;
    }
    .accent-line { display: none; }
    .title {
      position: relative;
      top: auto; left: auto;
      font-size: 22px;
      padding: 0 1.2rem;
      margin-top: 0;
      margin-bottom: .4rem;
      opacity: 1 !important;
      animation: none !important;
    }
    .subtitle {
      position: relative;
      top: auto; left: auto;
      font-size: 11px;
      padding: 0 1.2rem;
      margin-bottom: 1rem;
      opacity: 1 !important;
      animation: none !important;
    }
    .carousel-zone {
      position: relative !important;
      top: auto !important; bottom: auto !important;
      left: auto !important; right: auto !important;
      width: 100% !important;
      height: auto !important;
      gap: 14px;
      padding: .5rem 0;
      margin-top: 3rem;
      -webkit-mask-image: none !important;
      mask-image: none !important;
      overflow: hidden;
    }
    .sol-card { width: 130px !important; height: 72px !important; padding: 8px !important; }
    .sol-card img { max-height: 44px !important; }
    .carousel-track { gap: 10px !important; }
    .leyenda {
      position: relative;
      bottom: auto;
      margin-top: 1.2rem;
      opacity: 1 !important;
      animation: none !important;
    }
    .leyenda-line { width: 80%; }
    .tagline {
      position: relative !important;
      bottom: auto !important;
      opacity: 1 !important;
      animation: none !important;
      margin-top: 4rem;
      font-size: 14px !important;
      padding: 0 1rem;
    }
  }
  .tagline {
    position: absolute;
    bottom: 210px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    letter-spacing: .04em;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards 0.9s;
  }
</style>

const all = [
  { img: lefort,       name: "Lefort" },
  { img: plead,        name: "Ple.ad" },
  { img: rezolveai,    name: "Rezolve.ai" },
  { img: streamline,   name: "Streamline" },
  { img: supercompany, name: "SuperCompany" },
  { img: veridas,      name: "Veridas" },
  { img: aliado,       name: "Aliado" },
  { img: gauss,        name: "Gauss Control" },
  { img: dapta,        name: "Dapta" },
  { img: darktrace,    name: "Darktrace" },
  { img: birdie,       name: "Birdie" },
  { img: ruedata,      name: "RueData AI" },
  { img: smtsales,     name: "SmtSales" },
  { img: aleph,        name: "Aleph" },
  { img: scrapyard,    name: "Scrapyard" },

  { img: sapiens,   name: "Sapiens" },

  { img: d2s,       name: "D2S" },

function buildRow(trackEl, items) {
  const doubled = [...items, ...items, ...items];
  doubled.forEach(c => {
    const card = document.createElement('div');
    card.className = 'sol-card';
    card.innerHTML = `<img src="${c.img}" alt="${c.name}">`;
    trackEl.appendChild(card);
  });
}

const row1 = all.slice(0, 10);
const row2 = all.slice(8);

buildRow(document.getElementById('row1'), row1);
buildRow(document.getElementById('row2'), row2);

// Typewriter
const part1 = "Tecnología probada, ";
const part2 = "resultados desde el primer día";
const elBefore = document.getElementById('tw-before');
const elCyan   = document.getElementById('tw-cyan');
const cur      = document.getElementById('cur');
let i = 0;
const fullText = part1 + part2;

setTimeout(function type() {
  if (i < fullText.length) {
    if (i < part1.length) elBefore.textContent += fullText[i];
    else elCyan.textContent += fullText[i];
    i++;
    setTimeout(type, 50 + Math.random() * 30);
  } else {
    setTimeout(() => cur.classList.add('done'), 800);
  }
}, 1000);
</script>
