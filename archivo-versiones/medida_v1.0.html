<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindBridge â€” Soluciones a la medida</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0D1B2A;
    font-family: 'Barlow', sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .slide {
    width: 1280px;
    height: 720px;
    background: #0D1B2A;
    position: relative;
    overflow: hidden;
  }
  .accent-line {
    position: absolute;
    left: 0; top: 0;
    width: 7px; height: 100%;
    background: #05C8E0;
  }
  .solutions {
    position: absolute;
    top: 22px; bottom: 22px;
    left: 44px; right: 44px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .sol-card {
    flex: 1;
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto auto;
    column-gap: 28px;
    row-gap: 0;
    align-content: center;

  }
  .sol-logo-box {
    grid-column: 1;
    grid-row: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 80px;
    padding: 0 20px;
    border: 1px solid rgba(5,200,224,0.30);
    border-radius: 8px;
    background: #131f2d;
  }
  .sol-logo-box img {
    height: 100%;
    max-height: 72px;
    max-width: 220px;
    object-fit: contain;
  }
  .logo-sm { max-height: 48px !important; max-width: 182px !important; }
  .sol-tag {
    grid-column: 1;
    grid-row: 2;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #05C8E0;
    letter-spacing: 0.3px;
    margin-top: 2px;
    padding-top: 0;
  }
  .sol-desc {
    grid-column: 2;
    grid-row: 1 / 3;
    align-self: center;
    font-size: 17px;
    color: rgba(255,255,255,0.82);
    line-height: 1.55;
  }
  .sol-cur {
    display: inline-block;
    width: 2px; height: 13px;
    background: #05C8E0;
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 0.7s step-end infinite;
  }
  .sol-cur.done { animation: none; opacity: 0; }
  .divider {
    height: 1px;
    background: linear-gradient(90deg, rgba(5,200,224,0.18) 0%, transparent 100%);
  }

  @keyframes blink  { 0%,100%{opacity:1;} 50%{opacity:0;} }
</style>
</head>
